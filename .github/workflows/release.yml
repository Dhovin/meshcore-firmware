name: Release Heltec V4 Firmware

# Builds Heltec V4 firmware (.github/release-envs.txt) and publishes a GitHub Release.
# Triggers on standard version tags (v*), meshcore-v*, offband-v*, and manual workflow_dispatch.
# Public binaries carry placeholder secrets, configured at runtime.

on:
  push:
    tags:
      - 'v*'
      - 'offband-v*'
      - 'crosswire-v*'
      - 'meshcore-v*'
      - 'heltec-v4-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. v1.18.0)'
        required: true
        default: 'v1.18.0'
      publish_release:
        description: 'Publish GitHub Release with built Heltec V4 binaries'
        required: true
        type: boolean
        default: true
      env_filter:
        description: 'Optional environment filter (e.g. heltec_v4_tft_companion_observer_wifi, or blank for all Heltec V4 targets)'
        required: false
        default: ''
      draft:
        description: 'Publish as a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.read.outputs.envs }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Read Heltec V4 env list
        run: |
          filter="${{ github.event.inputs.env_filter }}"
          if [ -n "$filter" ]; then
            envs=$(echo "$filter" | tr ',' '\n' | tr ' ' '\n' | grep -vE '^[[:space:]]*$' | jq -R . | jq -cs .)
          else
            envs=$(grep -vE '^[[:space:]]*#' .github/release-envs.txt \
                   | grep -vE '^[[:space:]]*$' \
                   | jq -R . | jq -cs .)
          fi
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Selected $(echo "$envs" | jq 'length') Heltec V4 env(s) for release."

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.list.outputs.envs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-build-environment

      - name: Resolve firmware version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF_NAME}"
            ref="${ref#offband-}"
            ref="${ref#crosswire-}"
            ref="${ref#meshcore-}"
            ref="${ref#heltec-v4-}"
            echo "version=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dummy secrets stub (public build; configured at runtime)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.env }}
        env:
          FIRMWARE_VERSION: ${{ steps.ver.outputs.version }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.env }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.env }}
          path: out/*
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [list, build]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Collect firmware files
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          echo "Collected $(find out -type f | wc -l) firmware file(s)."

      - name: Resolve release tag and version
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.version }}"
          fi
          ver="${tag}"
          ver="${ver#offband-}"
          ver="${ver#crosswire-}"
          ver="${ver#meshcore-}"
          ver="${ver#heltec-v4-}"
          
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          
          if [[ "${tag}" == offband-* ]]; then
            echo "title=Offband Heltec V4 ${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "title=Heltec V4 Firmware ${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge stale assets from a prior run of this tag (#706)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          if [ -z "$(find out -type f -print -quit 2>/dev/null)" ]; then
            echo "out/ is empty (build produced nothing) -- refusing to purge a prior release."
            exit 0
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' > existing_assets.txt 2>/dev/null; then
            echo "No existing release for $tag -- nothing to purge."
            exit 0
          fi
          purged=0
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            if [ ! -f "out/$a" ]; then
              if gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" --yes; then
                purged=$((purged+1))
              else
                echo "WARN: failed to delete stale asset: $a"
              fi
            fi
          done < existing_assets.txt
          echo "Purged $purged stale asset(s)."

      - name: Extract release body
        run: |
          ver="${{ steps.rel.outputs.version }}"
          if [ -z "$ver" ]; then
            ver="${GITHUB_REF_NAME#offband-}"; ver="${ver#crosswire-}"; ver="${ver#meshcore-}"; ver="${ver#heltec-v4-}"
          fi
          exact="${ver#v}"                         # the version as tagged: 1.5.0-beta7
          base="${exact%-rc*}"; base="${base%-beta*}"  # the base version:   1.5.0
          prose="release-notes/${exact}.md"
          if [ -f "$prose" ]; then
            if [ ! -s "$prose" ]; then
              echo "::error::${prose} exists but is empty -- write the notes or delete the file" >&2
              exit 1
            fi
            cp "$prose" body.md
          else
            names=("$exact"); [ "$base" = "$exact" ] || names+=("$base")
            for want in "${names[@]}"; do
              awk -v v="$want" '
                BEGIN { head = "## [" v "]" }
                substr($0, 1, length(head)) == head { grab=1; next }
                grab && /^## \[/ { grab=0 }
                grab { print }
              ' CHANGELOG.md > body.md || true
              if [ -s body.md ]; then break; fi
            done
          fi
          if [ ! -s body.md ]; then
            echo "(Heltec V4 Firmware release ${ver}.)" > body.md
          fi
          # Append the static "which file do I download?" flashing guide to every release
          cat .github/release-footer.md >> body.md 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(steps.rel.outputs.tag, '-rc') || contains(steps.rel.outputs.tag, '-beta') }}
          draft: ${{ (github.event_name == 'workflow_dispatch' && inputs.draft) || false }}
          make_latest: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.prerelease || inputs.draft)) && !contains(steps.rel.outputs.tag, '-rc') && !contains(steps.rel.outputs.tag, '-beta') }}
          body_path: body.md
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: false
